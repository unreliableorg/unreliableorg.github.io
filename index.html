<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unreliable Org</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #1a202c;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 80px;
            max-width: 900px;
            text-align: center;
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .bot-icon {
            width: 80px;
            height: 80px;
            animation: sleepBob 3s ease-in-out infinite;
        }

        @keyframes sleepBob {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        .logo-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .logo-text {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .logo-subtitle {
            font-size: 14px;
            color: #718096;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .banner {
            background: linear-gradient(135deg, #f6f8fb 0%, #edf2f7 100%);
            border-left: 4px solid #667eea;
            padding: 30px 40px;
            border-radius: 8px;
            margin-top: 40px;
        }

        .banner-text {
            font-size: 18px;
            line-height: 1.6;
            color: #2d3748;
            font-style: italic;
        }

        .disclaimer {
            margin-top: 30px;
            font-size: 12px;
            color: #a0aec0;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
            }

            .logo {
                flex-direction: column;
                gap: 15px;
            }

            .logo-content {
                align-items: center;
            }

            .bot-icon {
                width: 60px;
                height: 60px;
            }

            .logo-text {
                font-size: 36px;
            }

            .banner-text {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <!-- Sleepy Bot Icon -->
            <svg class="bot-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Antenna -->
                <line x1="50" y1="10" x2="50" y2="20" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
                <circle cx="50" cy="8" r="4" fill="#764ba2"/>
                
                <!-- Head -->
                <rect x="25" y="20" width="50" height="45" rx="8" fill="#667eea"/>
                
                <!-- Sleepy Eyes (droopy lines) -->
                <path d="M 35 35 Q 40 38 45 35" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
                <path d="M 55 35 Q 60 38 65 35" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
                
                <!-- Small tired eye dots -->
                <circle cx="40" cy="40" r="2" fill="#ffffff" opacity="0.6"/>
                <circle cx="60" cy="40" r="2" fill="#ffffff" opacity="0.6"/>
                
                <!-- Mouth (sleepy/tired expression) -->
                <path d="M 40 50 Q 50 48 60 50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                
                <!-- Body -->
                <rect x="30" y="65" width="40" height="25" rx="5" fill="#764ba2"/>
                
                <!-- Body details (panel lines) -->
                <line x1="45" y1="70" x2="45" y2="85" stroke="#667eea" stroke-width="2" opacity="0.5"/>
                <line x1="55" y1="70" x2="55" y2="85" stroke="#667eea" stroke-width="2" opacity="0.5"/>
                
                <!-- Arms -->
                <rect x="15" y="68" width="12" height="6" rx="3" fill="#667eea"/>
                <rect x="73" y="68" width="12" height="6" rx="3" fill="#667eea"/>
                
                <!-- Legs -->
                <rect x="35" y="90" width="10" height="8" rx="2" fill="#667eea"/>
                <rect x="55" y="90" width="10" height="8" rx="2" fill="#667eea"/>
                
                <!-- ZZZ sleep symbols -->
                <text x="75" y="30" font-family="Arial, sans-serif" font-size="12" fill="#764ba2" opacity="0.7" font-weight="bold">Z</text>
                <text x="80" y="22" font-family="Arial, sans-serif" font-size="10" fill="#764ba2" opacity="0.5" font-weight="bold">Z</text>
                <text x="84" y="16" font-family="Arial, sans-serif" font-size="8" fill="#764ba2" opacity="0.3" font-weight="bold">Z</text>
            </svg>
            
            <div class="logo-content">
                <div class="logo-text">Unreliable Org</div>
                <div class="logo-subtitle">Testing Purposes Only</div>
            </div>
        </div>

        <div class="banner">
            <p class="banner-text">
                This org is used for testing. Any resemblence to an real life org is purly conincidental
            </p>
        </div>

        <div class="disclaimer">
            &copy; 2024-2025 Unreliable Org. For testing and satirical purposes only.
        </div>
    </div>
</body>
</html>
